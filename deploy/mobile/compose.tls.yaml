# Optional standalone TLS gateway. Omit when an existing host nginx owns 443.
services:
  gateway:
    image: ${MOBILE_NGINX_IMAGE:?Set a fixed nginx image digest}
    ports: ["${MOBILE_HTTPS_BIND:-0.0.0.0}:443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MOBILE_CERT_FILE:?Set fullchain path}:/etc/nginx/tls/fullchain.pem:ro
      - ${MOBILE_KEY_FILE:?Set key path}:/etc/nginx/tls/key.pem:ro
    depends_on: [backend]
    restart: unless-stopped
    networks: [edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
